<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>St. Xavier's Church - Video</title>

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            min-height:100vh;
            background:#08030a;
            color:white;
            font-family:Arial,sans-serif;

            display:flex;
            align-items:center;
            justify-content:center;

            padding:20px;
        }

        .video-box{
            width:100%;
            max-width:900px;
        }

        h1{
            text-align:center;
            margin-bottom:20px;
            font-size:24px;
        }

        .video-container{
            position:relative;
            width:100%;
            aspect-ratio:16/9;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 20px 60px rgba(0,0,0,.6);
        }

        iframe{
            width:100%;
            height:100%;
            border:0;
        }
    </style>
</head>

<body>

    <div class="video-box">

        <h1>புனித சவேரியார் ஆலயம்</h1>

        <div class="video-container">

            <iframe
                src="https://www.youtube.com/embed/Px43I0wFTIY"
                title="St. Xavier's Church Video"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </div>

    </div>

</body>
</html>
